name: Android & Googlebook OS CI Build

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  schedule:
    - cron: '0 6 * * *'
  workflow_dispatch:

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Sync Live EuroLeague Data, Verified Rosters, Injuries & Official Club Logos
        run: |
          python3 scripts/sync_euroleague_live_snapshot.py

      - name: Upload Live EuroLeague Snapshot & Official Logos Artifact
        uses: actions/upload-artifact@v4
        with:
          name: euroleague-live-snapshot-and-logos
          path: |
            app/src/main/assets/euroleague_live_snapshot.json
            app/src/main/assets/euroleague_club_logos_b64.json
            app/src/main/res/drawable-nodpi/club_logo_*.png

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: "17"
          distribution: "temurin"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Run Unit Tests (PIR, RFC 5545 .ics, Crunch-Time Alerts, Live Roster Verification)
        run: gradle testDebugUnitTest

      - name: Assemble Debug APK
        run: |
          gradle assembleDebug
          cp app/build/outputs/apk/debug/app-debug.apk app/build/outputs/apk/debug/EuroLeague-Courtside-v1.0.0-debug.apk

      - name: Upload EuroLeague Courtside APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: euroleague-courtside-debug-apk
          path: app/build/outputs/apk/debug/EuroLeague-Courtside-v1.0.0-debug.apk

      - name: Publish APK to GitHub Releases (v1.0.0)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release view v1.0.0 >/dev/null 2>&1 || gh release create v1.0.0 \
            --title "EuroLeague Courtside v1.0.0 (Live Data & Official Logos APK)" \
            --notes "Offizielle APK von **EuroLeague Courtside** mit Live-Anbindung an api-live.euroleague.net (v2/v3), echten offiziellen Vereins-Logos, geprüften Kadern & täglichem Injury-Report."
          gh release edit v1.0.0 \
            --title "EuroLeague Courtside v1.0.0 (Live Data & Official Logos APK)" \
            --notes "Offizielle APK von **EuroLeague Courtside** mit Live-Anbindung an api-live.euroleague.net (v2/v3), echten offiziellen Vereins-Logos (images.crest), geprüften Kadern (/people) & täglichem Injury-Report."
          gh release upload v1.0.0 app/build/outputs/apk/debug/EuroLeague-Courtside-v1.0.0-debug.apk --clobber
          gh release upload v1.0.0 app/src/main/assets/euroleague_live_snapshot.json --clobber
          gh release upload v1.0.0 app/src/main/assets/euroleague_club_logos_b64.json --clobber
