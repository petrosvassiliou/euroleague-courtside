name: Android & Googlebook OS CI Build

on:
  push:
    branches: [ "main", "master", "beta" ]
    tags: [ "v*" ]
  pull_request:
    branches: [ "main", "master", "beta" ]
  schedule:
    - cron: '0 6 * * *'
  workflow_dispatch:

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Extract App Version (versionName & versionCode) from Gradle
        id: version
        run: |
          VERSION_NAME=$(python3 -c 'import re; txt=open("app/build.gradle.kts").read(); print(re.search(r"versionName\s*=\s*\"([^\"]+)\"", txt).group(1))')
          VERSION_CODE=$(python3 -c 'import re; txt=open("app/build.gradle.kts").read(); print(re.search(r"versionCode\s*=\s*(\d+)", txt).group(1))')
          echo "version_name=${VERSION_NAME}" >> "$GITHUB_OUTPUT"
          echo "version_code=${VERSION_CODE}" >> "$GITHUB_OUTPUT"
          echo "Detected EuroLeague Courtside v${VERSION_NAME} (versionCode=${VERSION_CODE})"

      - name: Sync Live EuroLeague Data, Verified Rosters, Injuries & Official Club Logos
        run: |
          python3 scripts/sync_euroleague_live_snapshot.py

      - name: Upload Live EuroLeague Snapshot & Official Logos Artifact
        uses: actions/upload-artifact@v4
        with:
          name: euroleague-live-snapshot-and-logos
          path: |
            app/src/main/assets/euroleague_live_snapshot.json
            app/src/main/res/drawable-nodpi/club_logo_*.png

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: "17"
          distribution: "temurin"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Run Unit Tests (PIR, RFC 5545 .ics, Crunch-Time Alerts, 6-Language Notifications, Room v2 Offline Gamecast)
        run: gradle testDebugUnitTest

      - name: Prepare Optional Secret Signing Keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -n "${KEYSTORE_BASE64:-}" ]; then
            echo "${KEYSTORE_BASE64}" | base64 --decode > app/ci-release-keystore.jks
            echo "KEYSTORE_FILE=ci-release-keystore.jks" >> "$GITHUB_ENV"
          fi

      - name: Assemble Signed Release APK, Google Play App Bundle (.aab) & Debug APK
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          gradle assembleRelease assembleDebug bundleRelease
          cp app/build/outputs/apk/release/app-release.apk "app/build/outputs/apk/release/EuroLeague-Courtside-v${{ steps.version.outputs.version_name }}.apk"
          cp app/build/outputs/apk/debug/app-debug.apk "app/build/outputs/apk/debug/EuroLeague-Courtside-v${{ steps.version.outputs.version_name }}-debug.apk"
          cp app/build/outputs/bundle/release/app-release.aab "app/build/outputs/bundle/release/EuroLeague-Courtside-v${{ steps.version.outputs.version_name }}.aab"

      - name: Upload EuroLeague Courtside Signed Release APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: euroleague-courtside-release-apk-v${{ steps.version.outputs.version_name }}
          path: app/build/outputs/apk/release/EuroLeague-Courtside-v${{ steps.version.outputs.version_name }}.apk

      - name: Upload EuroLeague Courtside Signed Google Play Bundle (.aab) Artifact
        uses: actions/upload-artifact@v4
        with:
          name: euroleague-courtside-release-aab-v${{ steps.version.outputs.version_name }}
          path: app/build/outputs/bundle/release/EuroLeague-Courtside-v${{ steps.version.outputs.version_name }}.aab

      - name: Upload EuroLeague Courtside Debug APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: euroleague-courtside-debug-apk-v${{ steps.version.outputs.version_name }}
          path: app/build/outputs/apk/debug/EuroLeague-Courtside-v${{ steps.version.outputs.version_name }}-debug.apk

      - name: Publish Versioned Signed Release / Beta Pre-Release APK & AAB to GitHub Releases
        if: github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: v${{ steps.version.outputs.version_name }}
          VER_NAME: ${{ steps.version.outputs.version_name }}
          VER_CODE: ${{ steps.version.outputs.version_code }}
        run: |
          if [[ "${VER_NAME}" == *-* ]]; then
            TITLE="EuroLeague Courtside ${TAG} (Build ${VER_CODE} — Beta Pre-Release Signed APK & AAB)"
            NOTES="🧪 **Beta Pre-Release (\`EuroLeague-Courtside-${TAG}.apk\` & \`.aab\`, Build \`${VER_CODE}\`)** zum Vorab-Testen vor dem stabilen Rollout: **Sperrbildschirm Live-Game-Tracker** (\`ForegroundService\` gegen Android-Doze-Verzögerungen), **vollständiges Offline-Gamecast-Caching in Room v2** (Boxscores, Shot-Charts, Play-by-Play & Kader), **Erststart-Onboarding** (Club-, Theme- & Alarm-Setup), **Android 13+ Monochrome Themed Icon** sowie signiertes **Google Play App Bundle (\`.aab\`)** in allen 6 Sprachen (\`EN\`, \`DE\`, \`FR\`, \`IT\`, \`ES\`, \`EL\`)."
            if gh release view "${TAG}" >/dev/null 2>&1; then
              gh release edit "${TAG}" --title "${TITLE}" --notes "${NOTES}" --prerelease
            else
              gh release create "${TAG}" --title "${TITLE}" --notes "${NOTES}" --prerelease
            fi
          else
            TITLE="EuroLeague Courtside ${TAG} (Build ${VER_CODE} — Official Signed Release APK & AAB)"
            NOTES="🏀 **EuroLeague Courtside ${TAG} (\`EuroLeague-Courtside-${TAG}.apk\` & \`.aab\`, Build \`${VER_CODE}\`)** — Offizielles signiertes Release mit **Sperrbildschirm Live-Game-Tracker**, **vollständigem Offline-Gamecast-Caching (Room v2)**, **Erststart-Onboarding**, **Daylight Light Mode (Standard) & Courtside Dark Mode**, **5s High-Speed Live-Ticker**, **spielspezifischen Erinnerungen** (\`Q1\`, \`Halbzeit\`, \`Q3\`, \`Crunch-Time\`, \`Endergebnis\`), **Android 13+ Monochrome Icon** sowie Play-Protect-konformem **Stable/Beta In-App-Updater** in allen 6 Sprachen (\`EN\`, \`DE\`, \`FR\`, \`IT\`, \`ES\`, \`EL\`)."
            if gh release view "${TAG}" >/dev/null 2>&1; then
              gh release edit "${TAG}" --title "${TITLE}" --notes "${NOTES}" --latest
            else
              gh release create "${TAG}" --title "${TITLE}" --notes "${NOTES}" --latest
            fi
          fi
          gh release upload "${TAG}" "app/build/outputs/apk/release/EuroLeague-Courtside-${TAG}.apk" --clobber
          gh release upload "${TAG}" "app/build/outputs/bundle/release/EuroLeague-Courtside-${TAG}.aab" --clobber
          gh release upload "${TAG}" "app/build/outputs/apk/debug/EuroLeague-Courtside-${TAG}-debug.apk" --clobber
          gh release upload "${TAG}" app/src/main/assets/euroleague_live_snapshot.json --clobber

  macos-liquid-glass-build:
    needs: build-and-test
    runs-on: macos-15
    permissions:
      contents: write
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Extract App Version (versionName & versionCode) from Gradle
        id: version
        run: |
          VERSION_NAME=$(python3 -c 'import re; txt=open("app/build.gradle.kts").read(); print(re.search(r"versionName\s*=\s*\"([^\"]+)\"", txt).group(1))')
          VERSION_CODE=$(python3 -c 'import re; txt=open("app/build.gradle.kts").read(); print(re.search(r"versionCode\s*=\s*(\d+)", txt).group(1))')
          echo "version_name=${VERSION_NAME}" >> "$GITHUB_OUTPUT"
          echo "version_code=${VERSION_CODE}" >> "$GITHUB_OUTPUT"

      - name: Build, Test & Package macOS Liquid Glass App (.dmg & .zip)
        run: |
          chmod +x scripts/build_macos_app.sh
          ./scripts/build_macos_app.sh "${{ steps.version.outputs.version_name }}" "${{ steps.version.outputs.version_code }}"

      - name: Upload macOS Liquid Glass DMG & ZIP Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: euroleague-courtside-macos-liquid-glass-v${{ steps.version.outputs.version_name }}
          path: |
            macos/dist/EuroLeague-Courtside-v${{ steps.version.outputs.version_name }}-macOS.dmg
            macos/dist/EuroLeague-Courtside-v${{ steps.version.outputs.version_name }}-macOS.zip

      - name: Attach macOS Liquid Glass DMG & ZIP to GitHub Release
        if: github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: v${{ steps.version.outputs.version_name }}
        run: |
          gh release upload "${TAG}" "macos/dist/EuroLeague-Courtside-${TAG}-macOS.dmg" --clobber
          gh release upload "${TAG}" "macos/dist/EuroLeague-Courtside-${TAG}-macOS.zip" --clobber
