name: Android & Googlebook OS CI Build

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: "17"
          distribution: "temurin"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Run Unit Tests (PIR, RFC 5545 .ics, Crunch-Time Alerts)
        run: gradle testDebugUnitTest

      - name: Assemble Debug APK
        run: |
          gradle assembleDebug
          cp app/build/outputs/apk/debug/app-debug.apk app/build/outputs/apk/debug/EuroLeague-Courtside-v1.0.0-debug.apk

      - name: Upload EuroLeague Courtside APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: euroleague-courtside-debug-apk
          path: app/build/outputs/apk/debug/EuroLeague-Courtside-v1.0.0-debug.apk

      - name: Publish APK to GitHub Releases (v1.0.0)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release view v1.0.0 >/dev/null 2>&1 || gh release create v1.0.0 \
            --title "EuroLeague Courtside v1.0.0 (Debug APK)" \
            --notes "Erste offizielle APK von **EuroLeague Courtside** (Kotlin & Jetpack Compose Material 3 Adaptive) für Googlebook OS, Tablets, Foldables und Smartphones."
          gh release upload v1.0.0 app/build/outputs/apk/debug/EuroLeague-Courtside-v1.0.0-debug.apk --clobber

